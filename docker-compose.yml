services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodb_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [mongodb, redis]
    volumes: [".:/app", "/app/node_modules"]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run worker
    env_file: .env
    depends_on: [mongodb, redis]
    volumes: [".:/app", "/app/node_modules"]
volumes:
  mongodb_data: